name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [ "${{ github.ref_name }}" != "v${pkg_version}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version v${pkg_version}" >&2
            exit 1
          fi

      - run: npm ci

      - name: Publish package via Trusted Publishing
        run: npm publish --provenance --access public
